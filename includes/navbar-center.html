<style>
#quarto-header { display: none !important; }

/* ── Desktop: 3-column flex ── */
#site-nav {
  position: sticky;
  top: 0;
  z-index: 1000;
  width: 100%;
  background: #fff;
  border-bottom: 0.5px solid #E5E9F0;
  display: flex;
  align-items: center;
  height: 116px;
  padding: 0 40px;
  box-sizing: border-box;
}

#nav-left  { flex: 1; }
#nav-right { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 20px; }

#site-nav-inner {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

#nav-logo {
  display: flex;
  align-items: center;
  margin-right: 24px;
  border: none !important;
  text-decoration: none;
  flex-shrink: 0;
}
#nav-logo img {
  height: 56px;
  width: auto;
  mix-blend-mode: multiply;
  display: block;
}

#nav-links {
  display: flex;
  align-items: center;
  gap: 0;
}
#nav-links a {
  font-family: 'Lato', sans-serif;
  font-size: 17px;
  font-weight: 400;
  color: #4B5563;
  padding: 8px 16px;
  border-radius: 4px;
  border: none !important;
  text-decoration: none;
  white-space: nowrap;
  transition: color 0.15s, background 0.15s;
}
#nav-links a:hover { color: #003087; background: #F4F7FB; }

#nav-icons { display: flex; align-items: center; gap: 20px; }
#nav-icons a {
  color: #9CA3AF;
  border: none !important;
  text-decoration: none;
  display: flex;
  align-items: center;
  transition: color 0.15s;
}
#nav-icons a:hover { color: #003087; }

/* Hamburger — hidden on desktop */
#nav-hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 36px;
  height: 36px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
}
#nav-hamburger span {
  display: block;
  width: 24px;
  height: 2px;
  background: #4B5563;
  border-radius: 2px;
  transition: all 0.25s;
  transform-origin: center;
}
/* Animate to X when open */
#nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
#nav-hamburger.open span:nth-child(2) { opacity: 0; }
#nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ── Mobile: below 820px ── */
@media (max-width: 820px) {
  #site-nav {
    height: auto;
    min-height: 72px;
    flex-wrap: wrap;
    padding: 0 20px;
    align-items: center;
  }

  /* Hide spacer */
  #nav-left { display: none; }

  /* Logo takes natural width */
  #site-nav-inner { flex: 1; }
  #nav-logo img { height: 40px; }

  /* Right: just icons + hamburger */
  #nav-right {
    flex: 0;
    gap: 16px;
    padding: 16px 0;
  }

  #nav-hamburger { display: flex; }

  /* Nav links: hidden by default, shown when open */
  #nav-links {
    display: none;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    padding: 8px 0 16px;
    border-top: 0.5px solid #E5E9F0;
    gap: 0;
    /* Full-width row below logo+icons */
    order: 10;
    flex-basis: 100%;
  }
  #nav-links.open { display: flex; }
  #nav-links a {
    width: 100%;
    font-size: 16px;
    padding: 10px 4px;
    border-radius: 0;
    border-bottom: 0.5px solid #F4F7FB !important;
  }
  #nav-links a:last-child { border-bottom: none !important; }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var btn   = document.getElementById("nav-hamburger");
  var links = document.getElementById("nav-links");
  if (!btn || !links) return;
  btn.addEventListener("click", function () {
    var open = links.classList.toggle("open");
    btn.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open);
  });
  // Close menu when a link is clicked
  links.querySelectorAll("a").forEach(function (a) {
    a.addEventListener("click", function () {
      links.classList.remove("open");
      btn.classList.remove("open");
      btn.setAttribute("aria-expanded", false);
    });
  });
});
</script>
